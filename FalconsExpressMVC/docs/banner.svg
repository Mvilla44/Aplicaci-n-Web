<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgFal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E29"/>
      <stop offset="100%" stop-color="#212C3B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgFal)"/>

  <!-- storefront awning -->
  <polygon points="900,130 938,130 919,92" fill="#6C8EBF"/>
  <polygon points="938,130 976,130 957,92" fill="#9DB6D9"/>
  <polygon points="976,130 1014,130 995,92" fill="#6C8EBF"/>
  <polygon points="1014,130 1052,130 1033,92" fill="#9DB6D9"/>
  <polygon points="1052,130 1090,130 1071,92" fill="#6C8EBF"/>
  <polygon points="1090,130 1128,130 1109,92" fill="#9DB6D9"/>

  <!-- storefront body -->
  <rect x="900" y="130" width="228" height="132" fill="#232F3E" stroke="#3B4A5E" stroke-width="2"/>

  <!-- windows -->
  <rect x="920" y="150" width="46" height="46" rx="3" fill="#3B4A5E" stroke="#6C8EBF" stroke-width="1.5"/>
  <rect x="1062" y="150" width="46" height="46" rx="3" fill="#3B4A5E" stroke="#6C8EBF" stroke-width="1.5"/>

  <!-- door -->
  <rect x="989" y="182" width="50" height="80" rx="2" fill="#6C8EBF"/>
  <circle cx="1028" cy="222" r="2.4" fill="#161E29"/>

  <!-- text -->
  <text x="60" y="140" font-size="48" font-weight="700" fill="#EDEFF3">Falcons Express</text>

  <text x="60" y="180" font-size="19" fill="#93A1B5">Plataforma de venta de productos en PHP y MySQL</text>

  <!-- chips -->
  <g font-size="16" fill="#EDEFF3">
    <rect x="60" y="205" width="62" height="34" rx="8" fill="none" stroke="#6C8EBF" stroke-width="1.4"/>
    <text x="78" y="227">PHP</text>

    <rect x="134" y="205" width="86" height="34" rx="8" fill="none" stroke="#6C8EBF" stroke-width="1.4"/>
    <text x="152" y="227">MySQL</text>

    <rect x="232" y="205" width="66" height="34" rx="8" fill="none" stroke="#6C8EBF" stroke-width="1.4"/>
    <text x="250" y="227">MVC</text>
  </g>
</svg>
